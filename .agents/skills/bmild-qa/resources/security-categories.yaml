# bmild-qa/resources/security-categories.yaml
meta:
  artifact: security-review.md
  governed_by: bmild-qa
  loading_note: >
    Load before code or architecture security review. Categories define review scope;
    filtering defines exclusions and confidence threshold (0.8). Review depth and pacing
    live in the selected mode resource. Do not report hard exclusions or sub-threshold findings.

categories:
  - id: input_validation
    name: Input Validation Vulnerabilities
    stakes: consequential
    issues:
      - SQL injection via unsanitized user input
      - Command injection in system calls or subprocesses
      - XXE injection in XML parsing
      - Template injection in templating engines
      - NoSQL injection in database queries
      - Path traversal in file operations

  - id: authentication_authorization
    name: Authentication & Authorization Issues
    stakes: consequential
    issues:
      - Authentication bypass logic
      - Privilege escalation paths
      - Session management flaws
      - JWT token vulnerabilities
      - Authorization logic bypasses

  - id: crypto_secrets
    name: Crypto & Secrets Management
    stakes: consequential
    issues:
      - Hardcoded API keys, passwords, or tokens
      - Weak cryptographic algorithms or implementations
      - Improper key storage or management
      - Cryptographic randomness issues
      - Certificate validation bypasses

  - id: injection_code_execution
    name: Injection & Code Execution
    stakes: consequential
    issues:
      - Remote code execution via deserialization
      - Pickle injection in Python
      - YAML deserialization vulnerabilities
      - Eval injection in dynamic code execution
      - XSS vulnerabilities in web applications (reflected, stored, DOM-based)

  - id: data_exposure
    name: Data Exposure
    stakes: medium
    stakes_note: >
      Elevate to consequential pacing when a finding involves PII, credentials, or API endpoint
      leakage of sensitive records rather than debug-only metadata.
    issues:
      - Sensitive data logging or storage
      - PII handling violations
      - API endpoint data leakage
      - Debug information exposure

filtering:
  hard_exclusions:
    - Denial of Service vulnerabilities or resource exhaustion attacks.
    - Secrets or credentials stored on disk if they are otherwise secured.
    - Rate limiting concerns or service overload scenarios.
    - Memory consumption or CPU exhaustion issues.
    - Lack of input validation on non-security-critical fields without proven security impact.
    - Input sanitization concerns for GitHub Action workflows unless clearly triggerable via untrusted input.
    - A lack of hardening measures without a concrete vulnerability.
    - Race conditions or timing attacks that are theoretical rather than practical.
    - Vulnerabilities related only to outdated third-party libraries.
    - Memory safety issues in memory-safe languages unless unsafe code is implicated.
    - Files used only as tests.
    - Log spoofing from unsanitized user input.
    - SSRF that controls only a path rather than host or protocol.
    - User-controlled content included in AI prompts without a demonstrated security boundary.
    - Regex injection or regex denial-of-service concerns.
    - Findings only in documentation files.
    - A lack of audit logs.

  precedents:
    - Logging high-value secrets in plaintext is a vulnerability; logging ordinary URLs is not.
    - UUIDs are unguessable and do not need validation solely for secrecy.
    - Environment variables and CLI flags are trusted unless the review scope proves otherwise.
    - Resource-management issues are not security findings under this taxonomy.
    - Tabnabbing, XS-Leaks, prototype pollution, and open redirects require extremely high confidence.
    - React and Angular escape ordinary interpolation; require a concrete unsafe rendering path for XSS.
    - GitHub Action workflow findings need a clear untrusted trigger and exploit path.
    - Client-side permission checks are not required when enforcement is correctly performed server-side.
    - Notebook findings need a specific untrusted-input attack path.
    - Logging non-PII data is not a vulnerability.
    - Shell injection requires a specific path from untrusted input to command evaluation.

  confidence_scoring:
    threshold: 0.8
    scale:
      "0.9-1.0": Certain exploit path identified and tested when practical
      "0.8-0.9": Clear vulnerability pattern with a credible exploitation method
      "0.7-0.8": Suspicious pattern requiring specific conditions; do not report
      "Below 0.7": Too speculative to report

  severity_guidelines:
    critical: Direct exploitation crosses the trust boundary with full compromise — privileged code execution, complete data loss, or total authentication bypass
    high: Direct exploitation can produce code execution, data breach, or authentication bypass
    medium: Exploitation requires specific conditions but has significant impact
    low: Defense-in-depth or lower-impact concern; record only when it meets the confidence threshold and needs durable tracking — never blocks outcome acceptance

meta:
  artifact: ux-design.md
  governed_by: bmild-ux
  loading_note: >
    Load before writing ux-design.md. Each section carries a `stakes` field that
    categorizes elicitation depth — apply the behavioural rules from the active mode
    resource's Stakes-based elicitation section. Evaluate only sections applicable to the
    authorized outcome or an explicit initiative-wide UX invariant. Later phases are
    coherence context without implementation authority. For each in-scope section,
    privately verify falsifiable, good_signal, and weak_signal. Do not present this file
    to the user.

sections:

  - id: outcome_scope
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A reader can identify the authorized outcome or phase, its source requirements,
      affected existing surfaces, initiative-wide UX invariants, and deferred work without
      inferring scope from the rest of the document.
    good_signal: >
      The design names its authorization source and in-scope requirements, using FR and journey
      IDs when a PRD exists or precise request/source references for a direct UX engagement.
      Later-phase flows remain deferred and receive no binding screen, interaction, or state
      decisions unless they are necessary initiative-wide invariants or separately authorized.
    weak_signal: >
      The artifact covers the whole initiative without an authorized outcome, mixes
      MVP/Growth/Vision into one binding design, or gives future flows present authority.

  - id: contract_disposition
    required: true
    stakes: low
    falsifiable: >
      Alex and Rahat can distinguish binding user-observable behavior from delegated
      implementation mechanics, illustrative examples, and observed brownfield behavior.
    good_signal: >
      The artifact states its default interpretation and labels exceptions where needed.
      User-observable behavior, information, actions, states, accessibility, and consequential
      copy are committed; standard component mechanics and private state remain delegated
      when existing conventions suffice. Illustrative and observed content is non-binding.
    weak_signal: >
      Preferences or implementation mechanics can be mistaken for requirements, or a
      consequential observable behavior is left ambiguous merely by calling it conventional.

  - id: information_architecture
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A reviewer can enumerate the screens introduced or affected by the authorized outcome
      and their navigation relationships without inferring structure from other sections.
    good_signal: >
      All in-scope or affected screens are named, their hierarchy is explicit, how a user
      moves between them is stated, and the information visible at each level is identified.
      Unaffected and deferred-phase surfaces are not redesigned.
    weak_signal: >
      Screen names are listed without hierarchy or navigation paths, or the data
      displayed on each view is left to inference.

  - id: user_flows
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A tester can write a test script for the happy path and at least one error path
      for each flow from this section alone, and a reader can tell whether a flow
      reflects firsthand or illustrative source evidence.
    good_signal: >
      Each flow names its trigger, each step, the success exit condition, and at least
      one failure exit condition. When a flow translates an applicable PRD journey, the
      named protagonist, relevant inline context, climax, and failure path survive the
      translation, and the source journey's Firsthand or Illustrative evidence label
      is preserved — an illustrative source is never rewritten as observed behavior.
      Applicable empty and loading states are identified per flow. Every binding flow
      identifies its authorized outcome or initiative-wide scope.
    weak_signal: >
      Flows cover only the happy path, steps are described at a level of abstraction
      that a developer would need to make UX decisions to implement, or a source
      journey's protagonist, climax, failure path, or evidence label is silently
      dropped in translation.

  - id: interaction_model
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      For each consequential or non-standard interaction, a developer can state what
      triggers it and what the user observes, while standard mechanics remain delegated.
    good_signal: >
      Consequential or non-standard elements name the trigger, visible response, and relevant
      state transitions. Form validation is expressed as user-observable conditions. Modal
      and dialog lifecycles close when they affect outcome behavior. Standard component
      mechanics and private state handling may follow established conventions.
    weak_signal: >
      Consequential behavior is qualitative or unresolved, or standard implementation
      mechanics are specified without a user-observable consequence.

  - id: visual_design_language
    required: false
    stakes: medium
    applies_when: platform engagement or introducing new design tokens
    cross_ref:
      - DESIGN.md
    falsifiable: >
      A frontend developer can implement a new screen that is visually consistent
      with existing screens using only this section as reference, without asking
      a design question.
    good_signal: >
      Colour roles are mapped to values. Typography defines family, weight, and size
      for each text role. Spacing uses a named scale. Component visual states are
      enumerated (default, hover, active, disabled, focused, error).
    weak_signal: >
      Colors or typography described qualitatively ("modern", "clean"), or component
      states partially specified leaving some states undefined.

  - id: edge_states
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A QA engineer can test every applicable material edge state for the authorized outcome
      and can see why a normally relevant state was marked not applicable.
    good_signal: >
      Each in-scope surface is walked through the applicable states among empty, cold-load,
      error, offline, and permission-denied, plus populated where relevant. Each applicable
      state records usable behavior, not just its name. Material non-applicability has a
      reason; one identical reason may cover several surfaces only when those surfaces are
      named and the reason genuinely applies to each. Exact error copy is committed when
      wording affects trust, recovery, compliance, or product meaning; otherwise message
      intent and established content conventions are sufficient.
    weak_signal: >
      Edge states mentioned in aggregate ("handle errors appropriately") rather than
      per surface, a state named with no usable behavior, missing states silently ignored,
      a blanket non-applicability claim that hides a material exception, or preference-level
      copy frozen without a consequential reason.

  - id: accessibility
    required: false
    stakes: medium
    stakes_note: consequential when regulated accessibility obligations apply or when a hard WCAG level is named
    applies_when: any new interactive element or screen is introduced
    cross_ref: []
    falsifiable: >
      An accessibility tester can verify compliance for each interactive element by
      checking this section against the documented requirements.
    good_signal: >
      Keyboard navigation paths are described. Focus management on modal open/close
      is explicit. Colour contrast requirements reference a specific standard
      (e.g., WCAG AA). Screen reader labels are specified for non-text elements.
    weak_signal: >
      Accessibility addressed with a single statement ("must be accessible") or WCAG
      cited without specifying which success criteria apply to the interactive elements
      introduced.

  - id: ambiguity_disposition
    required: false
    stakes: low
    cross_ref:
      - prd.md
      - system-design.md
    falsifiable: >
      A reviewer can tell how unresolved ambiguity was governed without reading chat
      history: user-owned gaps resolved in chat, cross-artifact issues in `handoff.md`,
      or low-risk bounded assumptions in the consuming artifact.
    good_signal: >
      The source artifact remains authoritative. User-owned UX ambiguity is resolved
      live or queued with one discrete prompt and a promotion target. Product or
      architecture issues identify the target artifact and owner rather than living as
      durable handoff prose inside `ux-design.md`.
    weak_signal: >
      Embedded durable question sections in `ux-design.md`, unresolved ambiguity left only
      in chat, or cross-artifact issues with no target artifact or owner.

  - id: fr_coverage
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A reviewer can map each user-facing FR or direct source requirement in the authorized
      outcome to at least one UX design element, or to an explicit rationale that no UX
      treatment is required.
    good_signal: >
      Every applicable user-facing FR or direct source requirement in the authorized outcome
      is addressed by a screen, flow, interaction, or state. Non-user-facing requirements may
      be marked no UX treatment required with rationale. Later-phase requirements remain
      visibly deferred. Surface closure runs in both directions: every user-facing need in
      the authorized outcome traces to a serving surface, and every outcome surface traces
      back to a journey that reaches it; a shared or supporting surface carries a specific
      rationale instead of a forced artificial journey. A missing link is surfaced for
      operator resolution — never resolved by inventing a screen. A reviewer can trace
      coverage without treating deferred work as a present gap or requiring a PRD for an
      otherwise sufficient direct UX contract.
    weak_signal: >
      Authorized user-facing requirements have no visible UX treatment, coverage is assumed
      without traceability, backend-only requirements generate invented UI, a missing PRD is
      treated as a filename gate, deferred requirements become current design obligations,
      or an orphaned need or unjustified surface passes silently.

  - id: token_contract
    required: false
    stakes: medium
    applies_when: the design depends on tokens defined in a project-root DESIGN.md
    cross_ref:
      - DESIGN.md
    falsifiable: >
      Every token the in-scope design depends on is referenced by its resolvable
      `{path.to.token}` name, and the reference resolves against the project-root
      DESIGN.md token structure.
    good_signal: >
      Token references use resolvable `{path.to.token}` names into DESIGN.md. An
      unresolved or undefined token is surfaced as a finding for operator resolution;
      the check never invents a token to make a reference resolve. When no DESIGN.md
      exists and the design uses no tokens, the check has no entries and creates no
      obligation to create one.
    weak_signal: >
      Tokens described by adjective ("the brand blue") instead of resolvable name,
      references that cannot be followed to a defined token, or a token invented
      during design instead of surfaced as missing.

  - id: component_contract
    required: false
    stakes: medium
    applies_when: the design names in-scope components beyond standard mechanics
    cross_ref:
      - DESIGN.md
    falsifiable: >
      For each named in-scope component, a reviewer can identify a visual rule and a
      behavioral rule, or the established design-system rule that supplies either one.
    good_signal: >
      Every named in-scope component carries both a visual rule and a behavioral rule,
      or names the inherited design-system rule (with its source) that supplies either.
      An inherited claim without a source is a finding. Standard component mechanics
      covered by established conventions may remain delegated rather than restated.
    weak_signal: >
      A component has only visual treatment with no behavior, only behavior with no
      visual treatment, or an inherited rule asserted with no named source.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: external_references

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            .agents/**/*.md
            docs/**/*.md

  readme-version:
    name: Verify README Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README badge matches VERSION
        run: bash scripts/check-readme-version.sh

  contract-tests:
    name: Skill Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run contract tests
        run: |
          set -euo pipefail
          bash scripts/validate-skills.sh
          for s in tests/*-contract.sh; do
            echo "== ${s} =="
            bash "$s"
          done

  # elicitation-refine NFR cross-OS behavioral parity: the native selector and
  # prd-v1 linter run on each first-class OS. macOS proves the POSIX path under
  # BSD awk; Windows runs the PowerShell path under both pwsh and Windows
  # PowerShell 5.1 (the canonical PS gate per system-design §7).
  native-serving:
    name: Native Serving (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: POSIX serving and lint battery
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bash tests/method-serving-contract.sh
          bash tests/prd-lint-contract.sh
          bash tests/native-parity-contract.sh
      - name: PowerShell battery (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/native-serving-lane.ps1
      - name: Windows-native PowerShell 5.1 battery (canonical PS gate)
        if: runner.os == 'Windows'
        shell: powershell
        run: tests/native-serving-lane.ps1

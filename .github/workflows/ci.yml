name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: external_references

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            .agents/**/*.md
            docs/**/*.md

  readme-version:
    name: Verify README Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README badge matches VERSION
        run: bash scripts/check-readme-version.sh

  contract-tests:
    name: Skill Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run contract tests
        run: |
          set -euo pipefail
          bash scripts/validate-skills.sh
          for s in tests/*-contract.sh; do
            echo "== ${s} =="
            bash "$s"
          done

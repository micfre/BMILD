meta:
  artifact: system-design.md
  governed_by: bmild-arch
  loading_note: >
    Load before writing system-design.md. Each section carries a stakes field that
    categorizes elicitation depth. Apply the behavioural rules from the active mode
    resource. Evaluate only sections applicable to the authorized outcome or an explicit
    initiative-wide invariant. Later phases are context without implementation authority.
    Privately verify falsifiable, good_signal, and weak_signal. Do not present this file
    to the user.

sections:

  - id: outcome_scope
    required: true
    stakes: consequential
    cross_ref:
      - product-brief.md
      - prd.md
      - ux-design.md
    falsifiable: >
      A reader can identify the authorized outcome or phase, its source requirements,
      initiative-wide invariants, and deferred work without inferring scope from the rest
      of the document.
    good_signal: >
      The design names the authorization source, in-scope requirements, and explicit
      exclusions. Later-phase requirements are marked deferred and receive no binding
      implementation choices unless they are necessary foundations or separately authorized.
    weak_signal: >
      The artifact says only "the initiative," mixes MVP/Growth/Vision requirements into
      one undifferentiated design, or gives future work present implementation authority.

  - id: contract_disposition
    required: true
    stakes: low
    falsifiable: >
      For every architecture item, Alex can tell what it applies to and whether it is
      committed, delegated, illustrative, or observed.
    good_signal: >
      Items carry Applies to and Disposition labels. Only committed content binds
      implementation. Delegated content states its constraint boundary, illustrative
      content is visibly non-binding, and observed facts remain descriptive until promoted.
    weak_signal: >
      Unlabelled detail can be mistaken for a commitment, a delegated choice has no outer
      constraint, or implementation-observed reality is silently converted into design intent.

  - id: system_boundaries
    required: false
    stakes: consequential
    applies_when: a component, bounded context, ownership boundary, dependency direction, or trust zone is introduced or changed
    cross_ref:
      - prd.md
      - ux-design.md
    falsifiable: >
      A developer and reviewer can identify component responsibilities, allowed dependency
      directions, trust crossings, and data ownership relevant to the authorized outcome.
    good_signal: >
      Load-bearing boundaries name ownership, inputs/outputs, trust assumptions, prohibited
      coupling, and the observable consequence of crossing or violating the boundary.
    weak_signal: >
      Boxes are named without ownership or trust meaning, responsibility overlaps silently,
      or a topology preference is presented as a boundary requirement.

  - id: quality_attributes
    required: false
    stakes: medium
    applies_when: the authorized outcome has material latency, availability, capacity, privacy, compliance, scalability, or maintainability requirements
    cross_ref:
      - prd.md
    falsifiable: >
      A reviewer can determine the measurable or otherwise observable quality constraints
      the architecture must preserve and the evidence that will test them.
    good_signal: >
      Applicable quality attributes name a target or bounded expectation, operating context,
      architectural consequence, and proof approach. Non-applicable dimensions are omitted.
    weak_signal: >
      Generic goals such as "fast," "scalable," or "secure" appear without a context,
      bound, consequence, or validation method.

  - id: tech_stack
    required: false
    stakes: medium
    applies_when: a new runtime, framework, platform, or library choice creates a compatibility, security, build, operational, or lock-in commitment
    cross_ref: []
    falsifiable: >
      A developer can identify each committed technology constraint and which technology
      choices remain delegated.
    good_signal: >
      Committed products or version constraints name the constraint they satisfy, relevant
      compatibility/security/operational effects, and an alternative. Exact versions are
      specified only when they are themselves binding; ordinary package selection and
      patch-level choice may remain delegated.
    weak_signal: >
      A tool is named without its constraint or consequence, every implementation library
      is frozen pre-emptively, or a delegated choice is presented as a stack commitment.

  - id: database_schema
    required: false
    stakes: consequential
    applies_when: persisted data semantics, lifecycle, ownership, consistency, privacy, compatibility, or a physical schema commitment changes
    cross_ref:
      - prd.md
    falsifiable: >
      A developer can preserve committed data semantics and, when a physical schema is
      committed, generate the intended code-first migration without resolving ambiguity.
    good_signal: >
      Identity, ownership, lifecycle, retention, consistency, privacy, compatibility, and
      invariants are explicit when applicable. Committed physical schema specifies the
      necessary names, types, nullability, defaults, keys, indexes, constraints, enforcement
      layer, and migration intent. Physical representation and tuning remain delegated when
      they do not affect a committed consequence.
    weak_signal: >
      Data meaning or migration compatibility is ambiguous, physical details are mandatory
      without an architectural consequence, or a committed constraint lacks its enforcement
      layer.

  - id: api_contracts
    required: false
    stakes: consequential
    applies_when: a client-server, service-to-service, event, or third-party integration boundary is introduced or changed
    cross_ref:
      - prd.md
      - ux-design.md
    falsifiable: >
      Independent consumers and providers can interoperate for every committed boundary
      while private transport or adapter choices remain delegated where appropriate.
    good_signal: >
      Committed contracts specify identity, auth/trust, required inputs, success and
      distinguishable failure semantics, compatibility/versioning, and applicable ordering,
      idempotency, pagination, filtering, or sorting. Exact wire shapes are included when
      interoperability or compatibility requires them.
    weak_signal: >
      A committed boundary lacks interoperable behavior or error meaning, internal adapter
      details are frozen without consequence, or auth and compatibility are left implicit.

  - id: service_contracts
    required: false
    stakes: consequential
    applies_when: a service boundary has committed interoperability, side-effect, security, transactional, or compatibility obligations
    cross_ref:
      - prd.md
    falsifiable: >
      A developer can test a committed service boundary's behavior, side effects, and error
      cases without requiring private method structure to be predesigned.
    good_signal: >
      Each committed boundary specifies necessary inputs, outputs, side effects, error and
      transactional semantics. Signatures appear only when interoperability or another
      committed constraint requires them. Private methods, algorithms, and decomposition are
      explicitly delegated.
    weak_signal: >
      A committed boundary lacks testable behavior, or private method and class structure is
      specified as though it were architecture without a load-bearing consequence.

  - id: failure_and_consistency
    required: false
    stakes: consequential
    applies_when: partial failure, retry, concurrency, distributed state, asynchronous work, or recovery can affect committed behavior or data integrity
    cross_ref:
      - prd.md
    falsifiable: >
      A developer and reviewer can predict required behavior under the applicable failure,
      retry, concurrency, and recovery conditions.
    good_signal: >
      Applicable scenarios define detection, atomicity or consistency expectations,
      idempotency/retry behavior, degradation, reconciliation or rollback, recovery targets,
      and which mechanisms remain delegated.
    weak_signal: >
      The happy path is precise but duplicate delivery, partial writes, timeouts, races, or
      recovery behavior could change committed results without guidance.

  - id: dependency_decisions
    required: false
    stakes: medium
    applies_when: an external library, service, or infrastructure component creates a material compatibility, security, build, operational, cost, or lock-in consequence
    cross_ref: []
    falsifiable: >
      A reviewer can evaluate each committed dependency and its constraints while ordinary
      implementation dependencies remain Alex's choice.
    good_signal: >
      A committed dependency names the constraint it satisfies, at least one viable
      alternative, and material versioning, security, build, operational, cost, or lock-in
      effects. Preference-level dependencies are delegated.
    weak_signal: >
      Every library addition requires architecture approval, or a consequential dependency
      is named without alternatives and material consequences.

  - id: operability_and_evolution
    required: false
    stakes: medium
    applies_when: deployment, rollback, migration, observability, capacity, compatibility, or deprecation affects safe delivery or operation
    cross_ref:
      - prd.md
    falsifiable: >
      Operators and developers can identify required signals, rollout/rollback expectations,
      and compatibility or migration invariants for the authorized outcome.
    good_signal: >
      Applicable metrics/logs/traces, health signals, rollout and rollback constraints,
      capacity assumptions, compatibility windows, and evolution triggers are explicit;
      tool and implementation details remain delegated unless consequential.
    weak_signal: >
      The design cannot be safely observed, introduced, reversed, or evolved, or it mandates
      operational tooling without naming the constraint it satisfies.

  - id: architecture_decisions
    required: false
    stakes: consequential
    applies_when: a significant technical choice has more than one viable approach with different behavior, quality, evolution, or operational consequences
    cross_ref:
      - prd.md
    falsifiable: >
      For each committed decision, a reviewer can state what was decided, the constraint it
      satisfies, viable alternatives, why it was chosen, and what would reopen it.
    good_signal: >
      Each committed decision records context, evidence, viable alternatives with material
      consequences, rationale, applicability, and a revisit trigger when useful. A decision
      passing the drift-protection gate names the specific future divergence reversing it
      would cause — the divergence its ADR `Prevents` line carries. Preference-level
      choices are delegated or illustrative rather than elevated into commitments.
    weak_signal: >
      Rationale restates the choice, alternatives differ only cosmetically, a reversible
      implementation preference is treated as a one-way architectural door, or a
      qualifying decision's `Prevents` line merely repeats the decision instead of naming
      a real consequence.

  - id: dimension_sweep
    required: true
    stakes: medium
    cross_ref: []
    falsifiable: >
      A reviewer can enumerate the applicable structural dimensions and find each one
      decided (linked to its section), deferred with a reason, or an explicit open
      question — with no applicable dimension silently absent.
    good_signal: >
      The finalize sweep covers every applicable structural dimension, explicitly
      including the operational envelope: deployment and environments, infrastructure
      provider, capacity, and operations and observability. A dimension that does not
      apply is marked not applicable with its reason rather than omitted silently. The
      sweep is coverage, not a mandate to commit architecture where nothing applies.
    weak_signal: >
      A whole dimension — typically deployment, environments, or operations — is
      silently absent from the design with no decided/deferred/open-question record.

  - id: fr_coverage
    required: true
    stakes: consequential
    cross_ref:
      - prd.md
    falsifiable: >
      A reviewer can map every functional requirement in the authorized outcome to a
      supporting architecture element or an explicit determination that no architecture
      commitment is needed. Deferred-phase FRs are visibly outside present authority.
    good_signal: >
      Every in-scope FR maps to a boundary, data/API/service contract, decision, delegated
      implementation envelope, or explicit no-architecture-needed disposition. Gaps are
      resolved or routed. Later-phase FRs remain deferred unless separately authorized.
    weak_signal: >
      An authorized FR has no implementable support, every FR is forced into a low-level
      architecture element, or future-phase FRs acquire binding design accidentally.

  - id: ambiguity_disposition
    required: false
    stakes: low
    cross_ref:
      - prd.md
      - ux-design.md
    falsifiable: >
      A reviewer can tell how unresolved ambiguity was governed without reading chat history:
      user-owned gaps resolved in chat, cross-artifact issues in handoff.md, or reversible
      assumptions with a named revisit trigger.
    good_signal: >
      Source artifacts remain authoritative. User-owned architecture ambiguity is resolved
      live or queued with one discrete prompt and promotion target. Product or UX issues
      identify their target artifact and owner rather than becoming shadow design truth.
    weak_signal: >
      Durable questions remain embedded in system-design.md, ambiguity exists only in chat,
      or cross-artifact issues lack a target artifact, owner, or resumption condition.

meta:
  artifact: prd.md
  governed_by: bmild-pm
  loading_note: >
    Load before writing prd.md. Each section carries a `stakes` field that categorizes
    elicitation depth — apply the behavioural rules from the active mode resource's
    Stakes-based elicitation section. When `stakes_note` is present, it overrides the
    default stakes value for elicitation pacing. For each in-scope section, privately
    verify falsifiable, good_signal, and weak_signal. Do not present this file to the user.

sections:

  - id: functional_requirements
    required: true
    stakes: consequential
    cross_ref:
      - ux-design.md
      - system-design.md
    falsifiable: >
      A tester who has never seen the rest of the PRD can read each FR in isolation and
      determine pass or fail. A UX designer can design for every FR. An architect can
      support every FR.
    good_signal: >
      Requirements are organized by capability area, not by technology or layer. Each FR
      has a stable identifier and uses the format: [Actor] can [capability]. Each FR can be read in isolation and
      answered yes or no by a tester who has never seen the rest of the PRD. No UI
      details, performance numbers, or technology choices are embedded in FR statements.
      Every FR traces to a user need, success criterion, or journey step from
      product-brief.md — a reviewer can map each FR to its upstream source.
    weak_signal: >
      Requirements grouped by technical layer (frontend/backend/database), requirements
      that describe implementation rather than capability, or requirements so bundled
      that a tester cannot determine pass or fail from a single FR. FRs with no visible
      connection to user needs or the product brief.

  - id: coverage_check
    required: true
    stakes: consequential
    cross_ref:
      - product-brief.md
    falsifiable: >
      A reviewer can confirm that every capability area implied by the product brief's
      scope section has at least one FR, and that no FR is orphaned from the brief.
    good_signal: >
      The FRs collectively cover all capability areas implied by the product brief scope.
      If the brief names a capability area (e.g., "user management", "content discovery")
      that has no FRs, it is acknowledged and either deferred to a named phase or flagged
      as a gap. No FR exists without a traceable purpose in the brief.
    weak_signal: >
      Capability areas from the brief have no corresponding FRs with no acknowledgment,
      or FRs exist that introduce capabilities the brief never scoped — without flagging
      the expansion.

  - id: user_journeys
    required: false
    stakes: consequential
    applies_when: any requirement involves user-facing behavior or workflow change
    cross_ref:
      - ux-design.md
    falsifiable: >
      A tester can write a test script for the happy path and at least one error path
      for each journey from this section alone, and a reader can tell whether each
      journey reflects a confirmed firsthand account or an illustrative example.
    good_signal: >
      At least one end-to-end sequence with a stable identifier: named trigger, ordered
      steps, and success exit. The protagonist is a specific named person or precisely
      identified role ("Mary, mom of three", "the on-call SRE for tier-1 alerts"), never
      a generic "the user", with the context that matters carried inline at the steps
      where it matters instead of a standalone persona section. Each journey has a
      climax beat — the moment the value actually lands — and an explicit failure path
      a reader can picture. Every journey carries an evidence status: Firsthand
      (shaped from a confirmed real session) or Illustrative with the specific
      firsthand evidence gap recorded. A journey requirements summary connects
      journeys to capability areas named in the FRs.
    weak_signal: >
      A generic "the user" protagonist, persona context dumped into a standalone
      section or absent, a journey with no climax or failure path, or no evidence
      status. An illustrative journey whose label or evidence gap is missing is
      treated as unverified: a well-written example never becomes firsthand through
      detail alone.

  - id: success_measures
    required: false
    stakes: medium
    applies_when: the PRD records success metrics or measurable outcome signals
    falsifiable: >
      For each success metric, a reviewer can name the counter-signal that fires when
      the metric is improved in a harmful way.
    good_signal: >
      Each success metric is paired with a counter-metric naming the specific harmful
      optimization it detects (e.g., "search completion rate" paired with "result-set
      abandonment"). When no PRD-level metric is recorded, the section is omitted
      rather than padded with empty pairs.
    weak_signal: >
      Metrics that can be gamed with no counter-signal, counter-metrics that merely
      restate the primary metric, or a metric whose counter-metric names no harmful
      behavior.

  - id: scope_and_prioritization
    required: true
    stakes: consequential
    falsifiable: >
      A planner can read this section and sequence delivery without re-negotiating scope
      boundaries. Each phase with specified requirements names its observable outcome and
      included FR and journey IDs, and Phase 1 is distinguishable from Phase 2 without inference.
    good_signal: >
      Phase 1 (MVP) contains the absolute minimum needed to validate the idea. Phase 2 is
      clearly post-MVP. Each phase with detailed scope names an observable outcome and maps
      to stable FR and journey IDs; an outcome-only Vision may remain unspecific until it is
      refined. Requirements appear in one phase unless an explicit cross-phase reason is
      stated. Explicitly Out of Scope names things being actively decided against. The document
      makes clear that defining a phase does not itself authorize implementation. A planner
      could read this and sequence delivery without re-negotiating scope boundaries.
    weak_signal: >
      MVP that includes everything discussed, Growth items that sound mandatory through
      stakeholder language, phase bullets that cannot be traced to FR and journey IDs, a
      defined future phase mistaken for present implementation authority, or an out-of-scope
      list that is empty or too vague to bound design decisions.

  - id: nfr
    required: false
    stakes: medium
    stakes_note: consequential when regulated or when a hard threshold is named
    applies_when: any requirement touches performance, scale, data retention, security, compliance, or regulated data handling
    cross_ref:
      - system-design.md
    falsifiable: >
      Each NFR names a specific threshold and the scenario that triggers it — a tester
      can write a performance test or compliance check directly from the NFR statement.
    good_signal: >
      Each NFR names a threshold and the scenario that triggers it. Only categories
      relevant to this product are included — categories that don't apply are omitted
      rather than padded. Regulatory constraints name the specific obligation and the
      rule it imposes.
    weak_signal: >
      Phrases like "should be fast", "must be secure", "highly available" with no
      threshold. Compliance obligations named without citing the specific rule. NFR
      categories listed that don't apply to the product, inflating the section.

  - id: documentation_scope
    required: true
    stakes: medium
    cross_ref:
      - slice-*.md
      - verification-matrix.md
    falsifiable: >
      For each audience (user, operator, contributor), the documentation decision is
      recorded and the verifiable claim can be checked against shipped behaviour.
    good_signal: >
      User, operator, and contributor documentation are each marked required, not required,
      or deferred_by_user. Required items name the audience, reason, document or document
      type, and a verifiable claim Rahat can check against shipped behaviour.
    weak_signal: >
      Documentation mentioned generically ("update docs"), missing for one or more
      audiences, or lacking the verification expectation needed to confirm implementation
      satisfied the requirement.

  - id: assumptions
    required: false
    stakes: low
    falsifiable: >
      For each assumption, a reviewer can state what specifically would change in the
      PRD if the assumption is wrong.
    good_signal: >
      Each assumption names specifically what would change in the PRD if it turns out to
      be wrong. Confidence level is stated. The assumption is genuinely uncertain, not a
      confirmed constraint.
    weak_signal: >
      Assumptions listed without a stated consequence of being wrong, or assumptions that
      are actually constraints already confirmed by evidence.

  - id: ambiguity_disposition
    required: false
    stakes: low
    falsifiable: >
      A reviewer can determine whether unresolved ambiguity was resolved in chat,
      routed through `handoff.md`, bounded assumptions, or an explicit
      defer/reject/supersede outcome without inspecting chat history.
    good_signal: >
      Each material unresolved gap has a governed path. User input is captured as one
      discrete queued prompt with a promotion target. Cross-artifact issues identify the
      target artifact and owner. The PRD remains authoritative rather than hosting
      durable discussion threads.
    weak_signal: >
      Durable question sections in `prd.md`, user-owned gaps with no queue item, or
      cross-artifact issues left as free-form notes with no target artifact or owner.
